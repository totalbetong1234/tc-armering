<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TB Armering</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
</head>
<body>
  <header>
    <img src="icon.svg" alt="" class="logo">
    <h1>TB Armering</h1>
    <span class="version">v0.4.0</span>
  </header>

  <!-- Løpemeter -->
  <section class="card">
    <div class="row">
      <div>
        <div class="label">Løpemeter (LM)</div>
        <div class="hint" id="lmCount">Ikke skannet ennå</div>
      </div>
      <label class="switch" title="Skjul LM-armering">
        <input type="checkbox" id="toggleLm" disabled>
        <span class="slider"></span>
      </label>
    </div>
    <div class="hint">Bryter på = LM er skjult</div>
  </section>

  <!-- Konstruksjonsdeler -->
  <section class="card">
    <div class="row">
      <div class="label">Konstruksjonsdeler</div>
      <button class="small" id="resetColors" disabled title="Fjern farger og vis alt">Nullstill</button>
    </div>
    <div id="groups" class="groups"><div class="hint">Ikke skannet ennå</div></div>
  </section>

  <section class="card">
    <button id="rescan" disabled>Skann modellene på nytt</button>
    <details>
      <summary>Innstillinger</summary>
      <label class="field">Egenskaper for form (kommaseparert)
        <input id="lmProps" value="109 Form, 17 Formkode, Form armering">
      </label>
      <label class="field">Verdi som skal skjules
        <input id="lmValue" value="LM">
      </label>
      <label class="field">Egenskap for konstruksjonsdel
        <input id="delProps" value="10 Konstruksjonsdel">
      </label>
      <label class="field">Egenskap for posisjonsnr.
        <input id="posProps" value="11 PosNr, 100 Pos.">
      </label>
      <div class="hint">Søker i alle egenskapssett. Trykk «Skann på nytt» etter endring.</div>
    </details>
  </section>

  <div id="status" class="status">Kobler til Trimble Connect …</div>

  <script src="app.js"></script>
</body>
</html>
